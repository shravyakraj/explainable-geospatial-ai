[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-ai"
version = "0.1.0"
description = "Explainable AI Based Deforestation Anomaly Detection Using Geospatial Satellite Images"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Shravya" }
]
keywords = [
    "geospatial",
    "deforestation",
    "remote-sensing",
    "explainable-ai",
    "sentinel-2",
    "prodes",
    "change-detection",
    "tensorflow"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS"
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
